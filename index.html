<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goli maar</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
                        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            background: linear-gradient(-45deg, #4A1E5A, #2D1B69, #1A1A2E, #0F3460);
            background-size: 400% 400%;
            animation: nebula 20s ease infinite;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
        }
        
        #score {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #272701;
            font-size: 24px;
            font-family: monospace;
            text-shadow: 0 0 10px #693b00;
            z-index: 100;
            pointer-events: none;
        }
        
        #game {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .target {
            position: absolute;
            font-size: 40px;
            user-select: none;
            pointer-events: none;
        }
        
        #gun {
            position: fixed;
            bottom: 30px;
            left: 50%;
            width: 15px;
            height: 70px;
            background: #D4AF37;
            border-radius: 7px;
            box-shadow: 0 0 15px #D4AF37, 0 0 30px rgba(212, 175, 55, 0.5);
            transform: translateX(-50%);
            transform-origin: bottom center;
            pointer-events: none;
            z-index: 5;
        }
        
        .bullet {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 12px #FFD700, 0 0 24px rgba(255, 215, 0, 0.3);
            pointer-events: none;
        }
        
        .points {
            position: fixed;
            color: #f8fb20;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            z-index: 99;
        }
        
        @keyframes floatUp {
            from { opacity: 1; transform: translateY(0); }
        @keyframes nebula {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
            to { opacity: 0; transform: translateY(-50px); }
        }
        
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            padding: 20px;
        }
        
        #startScreen h1 {
            color: #03bcb6;
            font-size: 32px;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #02352e;
        }
        
        #startScreen p {
            color: white;
            text-align: center;
            margin: 10px 0;
            font-size: 16px;
        }
        
        #startBtn {
            margin-top: 30px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #003e2e;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 20px #252525;
        }
        
        #completionScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }
        
        #completionScreen.active {
            display: flex;
        }
        
        #completionScreen h1 {
            color: #00ff96;
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ff96;
        }
        
        #completionScreen p {
            color: #64c8ff;
            font-size: 18px;
            margin: 10px 0;
        }
        
        #redirectCountdown {
            color: #ff4fd8;
            font-size: 20px;
            margin-top: 30px;
            text-shadow: 0 0 10px #ff4fd8;
        }
    
        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        .confetti-heart {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
            animation: confettiFall 2s ease-out forwards;
        }
        
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>SHOOT VISHESH</h1>
        <p>Tap anywhere to shoot!</p>
        <p>+2 points per hit</p>
        <p>Reach 100 to win!</p>
        <button id="startBtn">START GAME</button>
    </div>
    
    <div id="completionScreen">
        <h1>CONGRATS!</h1>
        <p>You completed the game!</p>
        <p>Get ready for the quiz...</p>
        <div id="redirectCountdown">Redirecting in 5...</div>
    </div>
    
    <div id="score">Score: 0</div>
    <div id="game">
        <div id="gun"></div>
    </div>
    
    <script>
        // Game elements
        const game = document.getElementById('game');
        const gun = document.getElementById('gun');
        const scoreText = document.getElementById('score');
        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('startScreen');
        const completionScreen = document.getElementById('completionScreen');
        
        // Game state
        let score = 0;
        let targets = [];
        let bullets = [];
        let gameRunning = false;
        let spawnInterval = null;
        
        // Start game
        startBtn.addEventListener('click', startGame);
        startBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            startGame();
        });
        
        function startGame() {
            startScreen.style.display = 'none';
            gameRunning = true;
            score = 0;
            scoreText.textContent = 'Score: 0';
            
            // Spawn targets every second
            spawnInterval = setInterval(spawnTarget, 1000);
            
            // Start game loop
            requestAnimationFrame(updateLoop);
        }
        
        function spawnTarget() {
            if (!gameRunning) return;
            
            const target = document.createElement('div');
            target.className = 'target';
            target.textContent = '👨';
            
            // Random position and direction
            const fromLeft = Math.random() > 0.5;
            const x = fromLeft ? -60 : window.innerWidth + 60;
            const y = Math.random() * (window.innerHeight * 0.7);
            const speed = 1 + Math.random() * 2;
            
            target.style.left = x + 'px';
            target.style.top = y + 'px';
            
            game.appendChild(target);
            targets.push({
                el: target,
                x: x,
                y: y,
                speed: speed,
                direction: fromLeft ? 1 : -1
            });
        }
        
        function updateTargets() {
            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                t.x += t.speed * t.direction;
                t.el.style.left = t.x + 'px';
                
                // Remove if off screen
                if (t.x < -100 || t.x > window.innerWidth + 100) {
                    t.el.remove();
                    targets.splice(i, 1);
                }
            }
        }
        
        class Bullet {
            constructor(startX, startY, angle) {
                this.x = startX;
                this.y = startY;
                this.vx = Math.cos(angle) * 15;
                this.vy = Math.sin(angle) * 15;
                
                this.element = document.createElement('div');
                this.element.className = 'bullet';
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                
                game.appendChild(this.element);
            }

        // Romantic confetti function
        
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                
                // Check collision
                for (let i = targets.length - 1; i >= 0; i--) {
                    const t = targets[i];
                    const dx = this.x - t.x;
                    const dy = this.y - t.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 40) {
                        // Hit!
                        score += 2;
                        createRomanticConfetti(t.x, t.y);
                        scoreText.textContent = 'Score: ' + score;
                        
                        // Show points
                        const popup = document.createElement('div');
                        popup.className = 'points';
                        popup.textContent = '+2';
                        popup.style.left = t.x + 'px';
                        popup.style.top = t.y + 'px';
                        document.body.appendChild(popup);
                        setTimeout(() => popup.remove(), 800);
                        
                        // Remove target
                        t.el.remove();
                        targets.splice(i, 1);
                        
                        // Remove bullet
                        this.element.remove();
                        
                        // Check win condition
                        if (score >= 100) {
                            endGame();
                        }
                        
                        return false; // Bullet is done
                    }
                }
                
                // Remove if off screen
                if (this.x < -50 || this.x > window.innerWidth + 50 || 
                    this.y < -50 || this.y > window.innerHeight + 50) {
                    this.element.remove();
                    return false;
                }
                
                return true; // Bullet still active
            }
        }
        function createRomanticConfetti(x, y) {
            const hearts = ['💖', '✨', '💕', '🎊', '🎉'];
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti-heart';
                    confetti.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    confetti.style.left = x + 'px';
                    confetti.style.top = y + 'px';
                    confetti.style.fontSize = (20 + Math.random() * 20) + 'px';
                    confetti.style.color = ['#FFD700', '#D4AF37', '#FF69B4', '#FFFFFF'][Math.floor(Math.random() * 4)];
                    
                    // Random velocity
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 50 + Math.random() * 100;
                    confetti.style.setProperty('--vx', Math.cos(angle) * velocity + 'px');
                    confetti.style.setProperty('--vy', Math.sin(angle) * velocity + 'px');
                    
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 2000);
                }, i * 30);
            }
        }
        
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                
                // Check collision
                for (let i = targets.length - 1; i >= 0; i--) {
                    const t = targets[i];
                    const dx = this.x - t.x;
                    const dy = this.y - t.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 40) {
                        // Hit!
                        score += 2;
                        createRomanticConfetti(t.x, t.y);
                        scoreText.textContent = 'Score: ' + score;
                        
                        // Show points
                        const popup = document.createElement('div');
                        popup.className = 'points';
                        popup.textContent = '+2';
                        popup.style.left = t.x + 'px';
                        popup.style.top = t.y + 'px';
                        document.body.appendChild(popup);
                        setTimeout(() => popup.remove(), 800);
                        
                        // Remove target
                        t.el.remove();
                        targets.splice(i, 1);
                        
                        // Remove bullet
                        this.element.remove();
                        
                        // Check win condition
                        if (score >= 100) {
                            endGame();
                        }
                        
                        return false; // Bullet is done
                    }
                }
                
                // Remove if off screen
                if (this.x < -50 || this.x > window.innerWidth + 50 || 
                    this.y < -50 || this.y > window.innerHeight + 50) {
                    this.element.remove();
                    return false;
                }
                
                return true; // Bullet still active
            }
        }
        
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                if (!bullets[i].update()) {
                    bullets.splice(i, 1);
                }
            }
        }
        
        function updateLoop() {
            if (!gameRunning) return;
            
            updateTargets();
            updateBullets();
            
            requestAnimationFrame(updateLoop);
        }
        
        let lastShot = 0;
        function shoot(clientX, clientY) {
            const now = Date.now();
            if (now - lastShot < 200) return; // Throttle shots
            lastShot = now;
            
            const gunX = window.innerWidth / 2;
            const gunY = window.innerHeight - 60;
            const dx = clientX - gunX;
            const dy = clientY - gunY;
            const angle = Math.atan2(dy, dx);
            
            // Rotate gun
            gun.style.transform = 'translateX(-50%) rotate(' + (angle * 180 / Math.PI + 90) + 'deg)';
            
            // Create bullet
            bullets.push(new Bullet(gunX, gunY, angle));
        }
        
        // Touch/click events
        document.addEventListener('click', (e) => {
            if (gameRunning) {
                shoot(e.clientX, e.clientY);
            }
        });
        
        document.addEventListener('touchstart', (e) => {
            if (gameRunning && e.touches.length > 0) {
                e.preventDefault();
                const touch = e.touches[0];
                shoot(touch.clientX, touch.clientY);
            }
        }, { passive: false });
        
        function endGame() {
            gameRunning = false;
            clearInterval(spawnInterval);
            
            // Clean up
            bullets.forEach(b => b.element.remove());
            bullets = [];
            targets.forEach(t => t.el.remove());
            targets = [];
            
            // Show completion screen
            setTimeout(() => {
                completionScreen.classList.add('active');
                startCountdown();
            }, 1000);
        }
        
        function startCountdown() {
            let seconds = 5;
            const countdownEl = document.getElementById('redirectCountdown');
            
            const interval = setInterval(() => {
                seconds--;
                countdownEl.textContent = 'Redirecting in ' + seconds + '...';
                
                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.href = 'quiz.html';
                }
            }, 1000);
        }
    </script>
</body>
</html>
