<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Goli Maar</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;height:100vh;width:100vw;touch-action:none;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#4d0066 0%,#180026 35%,#080014 70%,#000000 100%);position:fixed;top:0;left:0;}
#score{position:fixed;top:20px;left:20px;color:#ff4fd8;font-size:clamp(20px,5vw,30px);text-shadow:0 0 5px #ff4fd8,0 0 10px #ff4fd8,0 0 20px #ff4fd8;z-index:100;font-family:'Press Start 2P',cursive;}
#game{width:100vw;height:100vh;position:fixed;top:0;left:0;}
.target{position:absolute;font-size:clamp(40px,12vw,55px);user-select:none;}
#gun{position:absolute;bottom:20px;left:50%;width:18px;height:100px;background:#ff4fd8;border-radius:10px;box-shadow:0 0 10px #ff4fd8,0 0 25px #ff4fd8;transform-origin:bottom center;transform:translateX(-50%);z-index:10;}
.bullet{position:absolute;width:12px;height:12px;background:radial-gradient(circle at 30% 30%,#ff00ff,#ff0088);border-radius:50%;box-shadow:0 0 8px #ff00ff,0 0 15px #ff4fd8;pointer-events:none;}
#stars{position:fixed;inset:0;overflow:hidden;pointer-events:none;}
.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;animation:twinkle 2s infinite;}
@keyframes twinkle{50%{opacity:.2;}}
.points{position:fixed;color:#ff4fd8;font-size:clamp(20px,5vw,30px);font-weight:bold;pointer-events:none;animation:floatUp .8s forwards;z-index:50;}
@keyframes floatUp{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-60px);}}
#startScreen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.92);z-index:9999;padding:20px;}
#startScreen h1{color:#ff4fd8;font-size:clamp(28px,8vw,42px);text-align:center;font-family:'Press Start 2P',cursive;text-shadow:0 0 10px #ff4fd8,0 0 20px #ff4fd8,0 0 40px #ff4fd8;}
#startScreen p{margin-top:20px;color:white;text-align:center;font-size:clamp(12px,3vw,16px);}
#startBtn{margin-top:35px;padding:clamp(12px,3vw,18px) clamp(20px,5vw,30px);border:none;border-radius:12px;cursor:pointer;color:white;background:#ff4fd8;font-family:'Press Start 2P',cursive;font-size:clamp(10px,2.5vw,14px);box-shadow:0 0 15px #ff4fd8,0 0 35px #ff4fd8;transition:all .3s ease;}
#startBtn:hover{transform:scale(1.05);}
#startBtn:active{transform:scale(.95);}
#completionScreen{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.95);z-index:10000;padding:20px;text-align:center;}
#completionScreen.active{display:flex;animation:fadeIn .6s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
#completionScreen h1{color:#00ff96;font-size:clamp(28px,8vw,48px);text-align:center;font-family:'Press Start 2P',cursive;text-shadow:0 0 10px #00ff96,0 0 20px #00ff96,0 0 40px #00ff96;margin-bottom:30px;animation:glow 1.5s ease-in-out infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 10px #00ff96,0 0 20px #00ff96,0 0 40px #00ff96;}50%{text-shadow:0 0 20px #00ff96,0 0 40px #00ff96,0 0 60px #00ff96;}}
#completionScreen p{color:#64c8ff;font-size:clamp(14px,3vw,20px);font-family:'Press Start 2P',cursive;margin:20px 0;}
#completionEmoji{font-size:clamp(60px,15vw,100px);margin:30px 0;animation:bounce 1s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-30px);}}
#redirectCountdown{color:#ff4fd8;font-size:clamp(18px,4vw,28px);font-family:'Press Start 2P',cursive;margin-top:40px;text-shadow:0 0 10px #ff4fd8,0 0 20px #ff4fd8;}
</style>
</head>
<body>
<div id="startScreen"><h1>SHOOT VISHESH</h1><p>Shoot the man emoji to earn points!</p><p>+2 points for every hit</p><button id="startBtn">START GAME</button></div>
<div id="completionScreen"><div id="completionEmoji">🎉</div><h1>CONGRATS!</h1><p>You completed the game!</p><p>Get ready for the quiz...</p><div id="redirectCountdown">Redirecting in 5...</div></div>
<div id="stars"></div>
<div id="score">Score: 0</div>
<div id="game"><div id="gun"></div></div>
<script>
const game=document.getElementById('game');const gun=document.getElementById('gun');const scoreText=document.getElementById('score');const starsContainer=document.getElementById('stars');for(let i=0;i<150;i++){const star=document.createElement('div');star.classList.add('star');star.style.left=Math.random()*window.innerWidth+'px';star.style.top=Math.random()*window.innerHeight+'px';star.style.animationDelay=Math.random()*2+'s';starsContainer.appendChild(star);}let score=0;let targets=[];let bullets=[];let gameRunning=false;function spawnTarget(){if(!gameRunning)return;const target=document.createElement('div');target.className='target';target.innerHTML='👨';const fromLeft=Math.random()>0.5;let x=fromLeft?-60:window.innerWidth+60;let y=Math.random()*(window.innerHeight*0.6);target.style.left=x+'px';target.style.top=y+'px';const speed=1+Math.random()*2;game.appendChild(target);targets.push({el:target,x,y,speed,direction:fromLeft?1:-1});}document.getElementById('startBtn').addEventListener('click',()=>{document.getElementById('startScreen').style.display='none';gameRunning=true;setInterval(spawnTarget,900);updateLoop();});function updateTargets(){for(let i=targets.length-1;i>=0;i--){const t=targets[i];t.x+=t.speed*t.direction;t.el.style.left=t.x+'px';if(t.x<-100||t.x>window.innerWidth+100){t.el.remove();targets.splice(i,1);}}}class Bullet{constructor(startX,startY,angle){this.x=startX;this.y=startY;this.angle=angle;this.speed=15;this.maxDistance=Math.max(window.innerWidth,window.innerHeight)*1.5;this.distance=0;this.element=document.createElement('div');this.element.className='bullet';game.appendChild(this.element);this.vx=Math.cos(angle)*this.speed;this.vy=Math.sin(angle)*this.speed;this.hitTargets=new Set();}update(){this.x+=this.vx;this.y+=this.vy;this.distance+=this.speed;this.element.style.left=this.x+'px';this.element.style.top=this.y+'px';targets.forEach((t,index)=>{if(!this.hitTargets.has(index)){const targetX=parseFloat(t.el.style.left)||0;const targetY=parseFloat(t.el.style.top)||0;const dist=Math.hypot(this.x-targetX,this.y-targetY);if(dist<50){this.hitTargets.add(index);score+=2;scoreText.textContent=\`Score: \${score}\`;const rect=t.el.getBoundingClientRect();const popup=document.createElement('div');popup.className='points';popup.innerHTML='+2';popup.style.position='fixed';popup.style.left=(rect.left+rect.width/2)+'px';popup.style.top=(rect.top+rect.height/2)+'px';document.body.appendChild(popup);setTimeout(()=>{popup.remove();},800);t.el.remove();targets.splice(index,1);if(score>=100){endGame()}}}});return this.distance<this.maxDistance;}remove(){this.element.remove();}}function updateLoop(){if(!gameRunning)return;updateTargets();for(let i=bullets.length-1;i>=0;i--){if(!bullets[i].update()){bullets[i].remove();bullets.splice(i,1);};}requestAnimationFrame(updateLoop);}function shoot(clientX,clientY){const gunX=window.innerWidth/2;const gunY=window.innerHeight-60;const dx=clientX-gunX;const dy=clientY-gunY;const angle=Math.atan2(dy,dx);const gunRotationAngle=angle*180/Math.PI+90;gun.style.transform=\`translateX(-50%) rotate(\${gunRotationAngle}deg)\`;const bullet=new Bullet(gunX,gunY,angle);bullets.push(bullet);}function cleanup(){bullets.forEach(b=>b.remove());bullets=[];targets.forEach(t=>t.el.remove());targets=[];}function endGame(){gameRunning=false;cleanup();document.getElementById('game').style.pointerEvents='none';setTimeout(()=>{document.getElementById('completionScreen').classList.add('active');startCountdown();},500);}function startCountdown(){let seconds=5;const countdownElement=document.getElementById('redirectCountdown');const interval=setInterval(()=>{seconds--;countdownElement.textContent=\`Redirecting in \${seconds}...\`;if(seconds<=0){clearInterval(interval);window.location.href='quiz.html';}},1000);}let lastShootTime=0;function handleShoot(x,y){const now=Date.now();if(now-lastShootTime<50)return;lastShootTime=now;if(gameRunning){shoot(x,y);}}game.addEventListener('click',(e)=>{handleShoot(e.clientX,e.clientY);});game.addEventListener('touchstart',(e)=>{e.preventDefault();if(e.touches.length>0){const touch=e.touches[0];handleShoot(touch.clientX,touch.clientY);}},{passive:false});window.addEventListener('resize',()=>{});
</script>
</body>
</html>
