<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Kaun Banega Mera Pati</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;
            font-family: 'Cormorant Garamond', Georgia, serif;

        }

                html, body {

            width: 100%;

            height: 100%;

            overflow: hidden;

            position: fixed;

            background: linear-gradient(-45deg, #fff3a6, #ffd1e8, #c9e7ff, #f8b7d8, #fff6b8);

            background-size: 400% 400%;

            animation: gradientShift 14s ease infinite;

        }

.container {

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            background: rgba(255, 255, 255, 0.22);

            backdrop-filter: blur(18px);

        }

.screen {

            display: none;

            flex: 1;

            flex-direction: column;

            padding: 20px;

        }

.screen.active {

            display: flex;

        }

.header {

            background: linear-gradient(135deg, #f6b8d2 0%, #b8d9f5 50%, #ffe89a 100%);

            box-shadow: 0 8px 24px rgba(80, 55, 90, 0.16);

            color: #3c2940;

            padding: 20px;

            text-align: center;

            border-radius: 0 0 20px 20px;

            margin-bottom: 20px;

        }

.header h1 {

            font-size: 28px;

            margin-bottom: 10px;

            font-weight: 600;

        }

.progress-bar {

            width: 100%;

            height: 6px;

            background: rgba(255, 255, 255, 0.55);

            border-radius: 3px;

            overflow: hidden;

            margin: 10px 0;

        }

.progress-fill {

            height: 100%;

            background: #e9a6c5;

            transition: width 0.3s;

        }

.question-number {

            font-size: 14px;

            opacity: 0.9;

        }

.question {

            font-size: 22px;

            color: #3c2940;

            font-weight: 600;

            text-align: center;

            margin: 20px 0;

            line-height: 1.4;

        }

.options {

            display: flex;

            flex-direction: column;

            gap: 12px;

            margin-bottom: 20px;

        }

.option {

            padding: 15px;

            border: 2px solid rgba(180, 126, 170, 0.45);

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.42);

            font-size: 16px;

            color: #46334a;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s;

        }

.option:active {

            transform: scale(0.98);

        }

.option.selected {

            border-color: #d58ab3;

            background: linear-gradient(135deg, #f3b3d0 0%, #c5dff5 100%);

            color: #FFFFFF;

            box-shadow: 0 8px 25px rgba(180, 120, 170, 0.22);

        }

.option.correct {

            border-color: #FFFFFF;

            background: linear-gradient(135deg, #b8e8c2 0%, #9fd5ef 100%);

            color: white;

        }

.next-btn {

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(135deg, #eaa9c8 0%, #b8d9f5 50%, #ffe59a 100%);

            color: #FFFFFF;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: auto;

            box-shadow: 0 6px 18px rgba(110, 85, 120, 0.18);

        }

.next-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }

.bonus-overlay {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(55, 35, 55, 0.48);

            display: none;

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 1000;

        }

.bonus-overlay.active {

            display: flex;

        }

.bonus-card {

            background: rgba(255, 255, 255, 0.94);

            border-radius: 20px;

            padding: 30px;

            text-align: center;

            max-width: 400px;

            width: 100%;

        }

.bonus-emoji {

            font-size: 60px;

            margin-bottom: 20px;

        }

.bonus-text {

            font-size: 24px;

            color: #4a354d;

            font-weight: 600;

            margin-bottom: 30px;

            line-height: 1.4;

        }

.bonus-buttons {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }

.btn-bonus {

            padding: 15px;

            border: 2px solid #A30505;

            border-radius: 12px;

            background: #e9a6c5;

            color: #FFFFFF;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

.btn-bonus:active {

            transform: scale(0.98);

        }

.confetti {

            position: fixed;

            font-size: 20px;

            pointer-events: none;

            z-index: 100;

            animation: fall 1.5s linear forwards;

        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fall {

            to {

                transform: translateY(100vh) rotate(360deg);

                opacity: 0;

            }

        }

        @media (max-width: 480px) {

.question {

                font-size: 20px;

            }

.option {

            padding: 15px;

            border: 2px solid rgba(180, 126, 170, 0.45);

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.42);

            font-size: 16px;

            color: #46334a;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s;

        }

.bonus-text {

                font-size: 22px;

            }

        }

    </style>

</head>

<body>

    <div class="container">

<!-- Quiz Screen -->

        <div id="quizScreen" class="screen active">

            <div class="header">

                <h1>!! Kaun Banega Mera Pati !!</h1>

                <div class="progress-bar">

                    <div class="progress-fill" id="progressFill"></div>

                </div>

                <div class="question-number">

                    Question <span id="currentQuestion">1</span> of 10

                </div>

            </div>

            <div class="question" id="questionText"></div>

            <div class="options" id="optionsContainer"></div>

            <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>

        </div>

<!-- Bonus Question Screen -->

        <div id="bonusQuestionScreen" class="screen">

            <div class="header">

                <h1>BONUS QUESTION</h1>

                <div class="progress-bar">

                    <div class="progress-fill" style="width: 100%"></div>

                </div>

                <div class="question-number">Final Question</div>

            </div>

            <div class="question" id="bonusQuestionText"></div>

            <div class="options" id="bonusOptionsContainer"></div>

            <button class="next-btn" id="bonusNextBtn" onclick="finishQuiz()" disabled>Finish Quiz</button>

        </div>

    </div>

<!-- Bonus Overlay -->

    <div id="bonusOverlay" class="bonus-overlay">

        <div class="bonus-card">

            <div class="bonus-emoji">🎉</div>

            <div class="bonus-text">Are you ready for the BONUS QUESTION?</div>

            <div class="bonus-buttons">

                <button class="btn-bonus" onclick="goToBonus()">YES</button>

                <button class="btn-bonus" onclick="goToBonus()">YESSSSSS</button>

            </div>

        </div>

    </div>

    <script>

        const quizQuestions = [

            { question: "What is the name of your dog?", options: ["Espresso", "Nescafe", "Coffee", "Can't remember"], correct: 2 },

            { question: "What is ICAI?", options: ["IDK", "Bitch-ass institute", "Life Destroyer", "Ninni Tem"], correct: [0,1,2,3] },

            { question: "Guess the Electricity Bill", options: ["2k", "5k", "7k", "13943"], correct: 3 },

            { question: "How many times have you blocked me on instagram?", options: ["1", "3", "4", "6"], correct: 3 },

            { question: "Which activity sounds most like us thing?", options: ["you blocking me", "Late-Night Talks", "Both A and B", "None"], correct: 2 },

            { question: "Would you rather...", options: ["Go on one really good date with me", "Hang out with me every weekend", "Get Matching Hoodies", "All three because obviously"], correct: 3 },

            { question: "Which financial statement shows a company's assets and liabilities?", options: ["Balance Sheet", "Cash Flow statement", "Profit and Loss account", "Trial Balance"], correct: 0 },

            { question: "What is depreciation mainly meant to account for?", options: ["Increase in asset value", "Allocation of an asset's depreciable amount over its useful life", "Cash spent on an asset", "Profit earned from an asset"], correct: 1 },

            { question: "What has the highest ROI", options: ["Stocks", "Mutual Funds", "Spending time w me", "Ofc it is C, do not overthink it"], correct: 3 },

            { question: "Hypothetically... if a boy who has known you for 5 months, really likes you, loves talking to you, thinks you are cute and has been waiting for the right moment ask =ed you one question...what should you answer?", options: ["huhh nigga", "Better Luck Next Time", "Yes idiot", "Ask the question already"], correct: [2,3] }

        ];

        const bonusQuestion = {

            question: "Heyyy there, senorita. I've known you for so long, yet somehow it feels like I just met you a week ago. You make me feel complete. I don't know, I feel like just talking to you makes me feel like I can fight my demons. So, I wanna ask you... Would you love to be my girlfriend?",

            options: ["Hell YES!", "100% Yes!", "FOK YEAA!"],

            correct: [0,1,2]

        };

        let currentQuestionIndex = 0;

        let answered = false;

        function displayQuestion() {

            const question = quizQuestions[currentQuestionIndex];

            document.getElementById('questionText').textContent = question.question;

            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;

            const optionsContainer = document.getElementById('optionsContainer');

            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {

                const btn = document.createElement('div');

                btn.className = 'option';

                btn.textContent = option;

                btn.onclick = () => selectOption(index, btn, false);

                optionsContainer.appendChild(btn);

            });

            updateProgressBar();

            answered = false;

            document.getElementById('nextBtn').disabled = true;

        }

        function selectOption(index, element, isBonus) {

            if (answered) return;

            answered = true;

            const question = isBonus ? bonusQuestion : quizQuestions[currentQuestionIndex];

            const container = isBonus ? '#bonusOptionsContainer' : '#optionsContainer';

// Disable all options

            document.querySelectorAll(container + ' .option').forEach(opt => {

                opt.style.pointerEvents = 'none';

            });

// Mark selected

            element.classList.add('selected');

// Check if correct (handles both single number and array)

            const isCorrect = Array.isArray(question.correct) 

                ? question.correct.includes(index)

                : question.correct === index;

            if (isCorrect) {

                element.classList.add('correct');

                createConfetti(element);

            }

// Enable next button

            const btn = isBonus ? document.getElementById('bonusNextBtn') : document.getElementById('nextBtn');

            btn.disabled = false;

        }

        function displayBonusQuestion() {

            document.getElementById('bonusQuestionText').textContent = bonusQuestion.question;

            const optionsContainer = document.getElementById('bonusOptionsContainer');

            optionsContainer.innerHTML = '';

            bonusQuestion.options.forEach((option, index) => {

                const btn = document.createElement('div');

                btn.className = 'option';

                btn.textContent = option;

                btn.onclick = () => selectOption(index, btn, true);

                optionsContainer.appendChild(btn);

            });

            answered = false;

            document.getElementById('bonusNextBtn').disabled = true;

        }

        function nextQuestion() {

            currentQuestionIndex++;

            if (currentQuestionIndex < 10) {

                displayQuestion();

            } else if (currentQuestionIndex === 10) {

                document.getElementById('bonusOverlay').classList.add('active');

            }

        }

        function goToBonus() {

            document.getElementById('bonusOverlay').classList.remove('active');

            document.getElementById('quizScreen').classList.remove('active');

            document.getElementById('bonusQuestionScreen').classList.add('active');

            displayBonusQuestion();

        }

        function finishQuiz() {

            alert('I will be waiting for your text <33');

// You can redirect or show a final screen

        }

        function updateProgressBar() {

            const progress = ((currentQuestionIndex + 1) / 10) * 100;

            document.getElementById('progressFill').style.width = progress + '%';

        }

        function createConfetti(element) {

            const emojis = ['✨'];

            const rect = element.getBoundingClientRect();

            const x = rect.left + rect.width / 2;

            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 12; i++) {

                setTimeout(() => {

                    const confetti = document.createElement('div');

                    confetti.className = 'confetti';

                    confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];

                    confetti.style.left = x + 'px';

                    confetti.style.top = y + 'px';

                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 1500);

                }, i * 30);

            }

        }

// Initialize

        displayQuestion();

    </script>

</body>

</html>
