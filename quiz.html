<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaun Banegaa Mera Pati</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, #FCEDD8 0%, #FFD464 25%, #FF5E5E 50%, #E23C64 75%, #B0183D 100%);
            animation: gradientShift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientShift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
            100% { transform: translate(0, 0); }
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.6s ease-out;
            position: relative;
            z-index: 10;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen {
            display: none;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 30px;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .header {
            background: linear-gradient(135deg, #FF5E5E 0%, #E23C64 50%, #B0183D 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
            margin: -40px -30px 30px -30px;
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .progress-container {
            margin-top: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD464 0%, #FCEDD8 100%);
            transition: width 0.5s ease;
        }

        .question-number {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .question {
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            color: #B0183D;
            font-weight: 700;
            margin-bottom: 35px;
            text-align: center;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option {
            padding: 18px 22px;
            border: 3px solid #FFD464;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(252, 237, 216, 0.5) 0%, rgba(255, 212, 100, 0.3) 100%);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            font-weight: 600;
            color: #B0183D;
            position: relative;
            overflow: hidden;
        }

        .option:hover {
            border-color: #FF5E5E;
            background: linear-gradient(135deg, rgba(255, 94, 94, 0.2) 0%, rgba(255, 212, 100, 0.4) 100%);
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(255, 94, 94, 0.2);
        }

        .option.selected {
            border-color: #E23C64;
            background: linear-gradient(135deg, #FF5E5E 0%, #E23C64 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(226, 60, 100, 0.4);
        }

        .option.correct {
            border-color: #4CAF50;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            animation: pulse 0.6s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .next-btn {
            width: 100%;
            padding: 16px 30px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #FF5E5E 0%, #E23C64 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(226, 60, 100, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(226, 60, 100, 0.5);
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bonus-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .bonus-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        .bonus-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            padding: 50px 30px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: bounceIn 0.6s ease-out;
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .bonus-emoji {
            font-size: 4.5rem;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .bonus-text {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            color: #B0183D;
            font-weight: 800;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .bonus-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-bonus {
            padding: 15px 35px;
            border: 3px solid #E23C64;
            border-radius: 12px;
            background: linear-gradient(135deg, #FFD464 0%, #FCEDD8 100%);
            color: #B0183D;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-width: 140px;
        }

        .btn-bonus:hover {
            background: linear-gradient(135deg, #FF5E5E 0%, #E23C64 100%);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(226, 60, 100, 0.4);
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            font-size: 1.5rem;
            z-index: 1000;
        }

        .confetti-burst {
            animation: confetti-fall 1.5s ease-out forwards;
        }

        @keyframes confetti-fall {
            to { transform: translateY(80vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 480px) {
            .container { min-height: 90vh; }
            .screen { padding: 30px 20px; }
            .header { margin: -30px -20px 20px -20px; padding: 20px 20px; }
            .bonus-card { padding: 40px 20px; }
            .bonus-emoji { font-size: 3.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="quizScreen" class="screen active">
            <div class="header">
                <h1>LOVE QUIZ</h1>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="question-number">Question <span id="currentQuestion">1</span> of 10</div>
                </div>
            </div>
            <div class="question" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
    </div>

    <div id="bonusQuestionScreen" class="container" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100;">
        <div class="screen active">
            <div class="header">
                <h1>BONUS QUESTION</h1>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 100%;"></div>
                    </div>
                    <div class="question-number">Final Question</div>
                </div>
            </div>
            <div class="question" id="bonusQuestionText"></div>
            <div class="options" id="bonusOptionsContainer"></div>
            <button class="next-btn" id="bonusNextBtn" onclick="finishQuiz()" disabled>Finish Quiz</button>
        </div>
    </div>

    <div id="bonusOverlay" class="bonus-overlay">
        <div class="bonus-card">
            <div class="bonus-emoji">🎉</div>
            <div class="bonus-text">Are you ready for the BONUS QUESTION?</div>
            <div class="bonus-buttons">
                <button class="btn-bonus" onclick="goToBonus()">YES</button>
                <button class="btn-bonus" onclick="goToBonus()">YESSSSSS</button>
            </div>
        </div>
    </div>

    <script>
        const quizQuestions = [
            { question: "What is the name of your dog?", options: ["Espresso", "Nescafe", "Coffee", "Can't remember"], correct: 2 },
            { question: "What is ICAI?", options: ["IDK", "Bitch-ass institute", "Life Destroyer", "Ninni Tem"], correct: 1 },
            { question: "Guess the Electricity Bill", options: ["2k", "5k", "7k", ""], correct: 2 },
            { question: "How many times have you blocked me on instagram?", options: ["1", "3", "4", "6"], correct: 2 },
            { question: "Which activity sounds most like us thing?", options: ["you blocking me", "Late-Night Talks", "Both A and B", "None"], correct: 2 },
            { question: "Would you rather...", options: ["Go on one really good date with me", "Hang out with me every weekend", "Get Matching Hoodies", "All three because obviously"], correct: 3 },
            { question: "Which financial statement shows a company's assets and liabilities?", options: ["Balance Sheet", "Cash Flow statement", "Profit and Loss account", "Trial Balance"], correct: 0 },
            { question: "What is depreciation mainly meant to account for?", options: ["Increase in asset value", "Allocation of an asset's depreciable amount over its useful life", "Cash spent on an asset", "Profit earned from an asset"], correct: 1 },
            { question: "What has the highest ROI", options: ["Stocks", "Mutual Funds", "Spending time w me", "Ofc it is C, do not overthink it"], correct: 0 },
            { question: "Hypothetically... if a boy who has known you for 5 months, really likes you, loves talking to you, thinks you are cute and has been waiting for the right moment ask =ed you one question...what should you answer?", options: ["", "Better Luck Next Time", "Yes idiot", "Ask the question already"], correct: 0 }
        ];

        const bonusQuestion = {
            question: "Would you love to be my girlfriend?",
            options: ["Hell YES!", "100% Yes!", "FOK YEAA!"],
            correct: 0
        };

        let currentQuestionIndex = 0;
        let answered = false;

        function displayQuestion() {
            const question = quizQuestions[currentQuestionIndex];
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn, false);
                optionsContainer.appendChild(btn);
            });

            updateProgressBar();
            answered = false;
            document.getElementById('nextBtn').disabled = true;
        }

        function selectOption(index, element, isBonus) {
            if (answered) return;
            answered = true;

            const question = isBonus ? bonusQuestion : quizQuestions[currentQuestionIndex];
            const container = isBonus ? '#bonusOptionsContainer' : '#optionsContainer';
            
            document.querySelectorAll(container + ' .option').forEach(opt => {
                opt.style.pointerEvents = 'none';
            });

            element.classList.add('selected');

            if (index === question.correct) {
                element.classList.add('correct');
                createConfetti(element);
            }

            const btn = isBonus ? document.getElementById('bonusNextBtn') : document.getElementById('nextBtn');
            btn.disabled = false;
        }

        function displayBonusQuestion() {
            document.getElementById('bonusQuestionText').textContent = bonusQuestion.question;
            const optionsContainer = document.getElementById('bonusOptionsContainer');
            optionsContainer.innerHTML = '';

            bonusQuestion.options.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn, true);
                optionsContainer.appendChild(btn);
            });

            answered = false;
            document.getElementById('bonusNextBtn').disabled = true;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < 10) {
                displayQuestion();
            } else if (currentQuestionIndex === 10) {
                document.getElementById('bonusOverlay').classList.add('active');
            }
        }

        function goToBonus() {
            document.getElementById('bonusOverlay').classList.remove('active');
            document.querySelector('.container').style.display = 'none';
            document.getElementById('bonusQuestionScreen').style.display = 'flex';
            displayBonusQuestion();
        }

        function finishQuiz() {
            alert('🎉 Quiz Complete! Thanks for playing!');
            location.reload();
        }

        function updateProgressBar() {
            const progress = ((currentQuestionIndex + 1) / 10) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function createConfetti(element) {
            const emojis = ['🎉', '💕', '✨', '💖', '🎊', '⭐'];
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti confetti-burst';
                    confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    confetti.style.left = x + 'px';
                    confetti.style.top = y + 'px';
                    const angle = (Math.PI * 2 * i) / 15;
                    const distance = 50;
                    confetti.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) rotate(${Math.random() * 360}deg)`;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 1500);
                }, i * 20);
            }
        }

        displayQuestion();
    </script>
</body>
</html>
