<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaun Banega Mera Pati</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom right, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.85));
            backdrop-filter: blur(10px);
        }
        
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 20px;
        }
        
        .screen.active {
            display: flex;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 0 0 20px 20px;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #FFD464;
            transition: width 0.3s;
        }
        
        .question-number {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .question {
            font-size: 22px;
            color: #B0183D;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            line-height: 1.4;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .option {
            padding: 15px;
            border: 2px solid #FFD464;
            border-radius: 12px;
            background: rgba(255, 212, 100, 0.1);
            font-size: 16px;
            color: #B0183D;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .option:active {
            transform: scale(0.98);
        }
        
        .option.selected {
            border-color: #E23C64;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .option.correct {
            border-color: #4CAF50;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }
        
        .next-btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
        }
        
        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .bonus-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        
        .bonus-overlay.active {
            display: flex;
        }
        
        .bonus-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        .bonus-emoji {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .bonus-text {
            font-size: 24px;
            color: #B0183D;
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        
        .bonus-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn-bonus {
            padding: 15px;
            border: 2px solid #E23C64;
            border-radius: 12px;
            background: #FFD464;
            color: #B0183D;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-bonus:active {
            transform: scale(0.98);
        }
        
        .confetti {
            position: fixed;
            font-size: 20px;
            pointer-events: none;
            z-index: 100;
            animation: fall 1.5s linear forwards;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        @media (max-width: 480px) {
            .question {
                font-size: 20px;
            }
            
            .option {
                font-size: 15px;
                padding: 14px;
            }
            
            .bonus-text {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen active">
            <div class="header">
                <h1>!! Kaun Banega Mera Pati !!</h1>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="question-number">
                    Question <span id="currentQuestion">1</span> of 10
                </div>
            </div>
            <div class="question" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
        
        <!-- Bonus Question Screen -->
        <div id="bonusQuestionScreen" class="screen">
            <div class="header">
                <h1>BONUS QUESTION</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 100%"></div>
                </div>
                <div class="question-number">Final Question</div>
            </div>
            <div class="question" id="bonusQuestionText"></div>
            <div class="options" id="bonusOptionsContainer"></div>
            <button class="next-btn" id="bonusNextBtn" onclick="finishQuiz()" disabled>Finish Quiz</button>
        </div>
    </div>
    
    <!-- Bonus Overlay -->
    <div id="bonusOverlay" class="bonus-overlay">
        <div class="bonus-card">
            <div class="bonus-emoji">🎉</div>
            <div class="bonus-text">Are you ready for the BONUS QUESTION?</div>
            <div class="bonus-buttons">
                <button class="btn-bonus" onclick="goToBonus()">YES</button>
                <button class="btn-bonus" onclick="goToBonus()">YESSSSSS</button>
            </div>
        </div>
    </div>
    
    <script>
        const quizQuestions = [
            { question: "What is the name of your dog?", options: ["Espresso", "Nescafe", "Coffee", "Can't remember"], correct: 2 },
            { question: "What is ICAI?", options: ["IDK", "Bitch-ass institute", "Life Destroyer", "Ninni Tem"], correct: 1 },
            { question: "Guess the Electricity Bill", options: ["2k", "5k", "7k", ""], correct: 2 },
            { question: "How many times have you blocked me on instagram?", options: ["1", "3", "4", "6"], correct: 3 },
            { question: "Which activity sounds most like us thing?", options: ["you blocking me", "Late-Night Talks", "Both A and B", "None"], correct: 2 },
            { question: "Would you rather...", options: ["Go on one really good date with me", "Hang out with me every weekend", "Get Matching Hoodies", "All three because obviously"], correct: 3 },
            { question: "Which financial statement shows a company's assets and liabilities?", options: ["Balance Sheet", "Cash Flow statement", "Profit and Loss account", "Trial Balance"], correct: 0 },
            { question: "What is depreciation mainly meant to account for?", options: ["Increase in asset value", "Allocation of an asset's depreciable amount over its useful life", "Cash spent on an asset", "Profit earned from an asset"], correct: 1 },
            { question: "What has the highest ROI", options: ["Stocks", "Mutual Funds", "Spending time w me", "Ofc it is C, do not overthink it"], correct: 0 },
            { question: "Hypothetically... if a boy who has known you for 5 months, really likes you, loves talking to you, thinks you are cute and has been waiting for the right moment ask =ed you one question...what should you answer?", options: ["", "Better Luck Next Time", "Yes idiot", "Ask the question already"], correct: 2 }
        ];
        
        const bonusQuestion = {
            question: "Heyyy there senorita, I have known you for so long time yet it feels like I just met you a week ago. You make me feel completed, idk I feel like by talking to you I can fight demons. So, I wanna ask you...Would you love to be my girlfriend?",
            options: ["Hell YES!", "100% Yes!", "FOK YEAA!"],
            correct: [0,1,2]
        };
        
        let currentQuestionIndex = 0;
        let answered = false;
        
        function displayQuestion() {
            const question = quizQuestions[currentQuestionIndex];
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn, false);
                optionsContainer.appendChild(btn);
            });
            
            updateProgressBar();
            answered = false;
            document.getElementById('nextBtn').disabled = true;
        }
        
        function selectOption(index, element, isBonus) {
            if (answered) return;
            answered = true;
            
            const question = isBonus ? bonusQuestion : quizQuestions[currentQuestionIndex];
            const container = isBonus ? '#bonusOptionsContainer' : '#optionsContainer';
            
            document.querySelectorAll(container + ' .option').forEach(opt => {
                opt.style.pointerEvents = 'none';
            });
            
            element.classList.add('selected');
            
            if (question.correct.includes(index)) {
                element.classList.add('correct');
                createConfetti(element);
            }
            
            const btn = isBonus ? document.getElementById('bonusNextBtn') : document.getElementById('nextBtn');
            btn.disabled = false;
        }
        
        function displayBonusQuestion() {
            document.getElementById('bonusQuestionText').textContent = bonusQuestion.question;
            
            const optionsContainer = document.getElementById('bonusOptionsContainer');
            optionsContainer.innerHTML = '';
            
            bonusQuestion.options.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn, true);
                optionsContainer.appendChild(btn);
            });
            
            answered = false;
            document.getElementById('bonusNextBtn').disabled = true;
        }
        
        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < 10) {
                displayQuestion();
            } else if (currentQuestionIndex === 10) {
                document.getElementById('bonusOverlay').classList.add('active');
            }
        }
        
        function goToBonus() {
            document.getElementById('bonusOverlay').classList.remove('active');
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('bonusQuestionScreen').classList.add('active');
            displayBonusQuestion();
        }
        
        function finishQuiz() {
            alert('🎉 Quiz Complete! Thanks for playing!');
            // You can redirect or show a final screen
        }
        
        function updateProgressBar() {
            const progress = ((currentQuestionIndex + 1) / 10) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        function createConfetti(element) {
            const emojis = ['✨'];
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    confetti.style.left = x + 'px';
                    confetti.style.top = y + 'px';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 1500);
                }, i * 30);
            }
        }
        
        // Initialize
        displayQuestion();
    </script>
</body>
</html>
