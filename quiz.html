<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Romantic Love Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; background: linear-gradient(135deg, #b76e79 0%, #ffcccb 50%, #f8c8dc 100%); font-family: 'Cormorant Garamond', serif; }
        @keyframes floatPetals { 0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; } 50% { transform: translateY(-15px) rotate(10deg); opacity: 0.5; } }
        .rose-petal { position: fixed; font-size: 20px; color: rgba(183, 110, 121, 0.4); animation: floatPetals 8s infinite ease-in-out; pointer-events: none; z-index: 1; }
        .container { width: 100%; height: 100%; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); }
        .screen { display: none; flex: 1; flex-direction: column; padding: 20px; }
        .screen.active { display: flex; }
        .header { background: linear-gradient(135deg, #b76e79 0%, #d8a7b1 100%); color: #fffaf0; padding: 25px; text-align: center; border-radius: 0 0 25px 25px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(183, 110, 121, 0.3); }
        .header h1 { font-size: 32px; margin-bottom: 15px; font-weight: 700; font-style: italic; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.3); border-radius: 3px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: #fffaf0; transition: width 0.3s; }
        .question-number { font-size: 16px; opacity: 0.9; color: #fffaf0; }
        .question { font-size: 26px; color: #5d4037; font-weight: 500; font-style: italic; text-align: center; margin: 30px 0; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .option { padding: 18px; border: 2px solid #b76e79; border-radius: 12px; background: rgba(255, 250, 240, 0.8); font-size: 18px; color: #5d4037; font-weight: 400; cursor: pointer; transition: all 0.3s; }
        .option:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(183, 110, 121, 0.2); }
        .option.selected { border-color: #8b4513; background: linear-gradient(135deg, #b76e79 0%, #d8a7b1 100%); color: #fffaf0; font-weight: 600; }
        .option.correct { border-color: #2e8b57; background: linear-gradient(135deg, #2e8b57 0%, #3cb371 100%); color: white; }
        .next-btn { padding: 18px; border: none; border-radius: 12px; background: linear-gradient(135deg, #b76e79 0%, #d8a7b1 100%); color: #fffaf0; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: auto; transition: all 0.3s; }
        .next-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(183, 110, 121, 0.3); }
        .next-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .bonus-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .bonus-overlay.active { display: flex; }
        .bonus-card { background: white; border-radius: 20px; padding: 30px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .bonus-emoji { font-size: 60px; margin-bottom: 20px; }
        .bonus-text { font-size: 24px; color: #5d4037; font-weight: bold; margin-bottom: 30px; line-height: 1.4; }
        .bonus-buttons { display: flex; flex-direction: column; gap: 12px; }
        .btn-bonus { padding: 15px; border: 2px solid #b76e79; border-radius: 12px; background: #fffaf0; color: #b76e79; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-bonus:hover { background: #b76e79; color: #fffaf0; }
        @keyframes heartConfetti { 0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(-100px) rotate(360deg) scale(0); opacity: 0; } }
        .quiz-confetti { position: fixed; font-size: 20px; pointer-events: none; z-index: 1000; animation: heartConfetti 1.5s ease-out forwards; }
        @media (max-width: 480px) {
            .question { font-size: 22px; }
            .option { font-size: 16px; padding: 15px; }
            .header h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="quizScreen" class="screen active">
            <div class="header">
                <h1>💖 Romantic Love Quiz 💖</h1>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="question-number">Question <span id="currentQuestion">1</span> of 10</div>
            </div>
            <div class="question" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
        <div id="bonusQuestionScreen" class="screen">
            <div class="header">
                <h1>🌟 Bonus Question 🌟</h1>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 100%"></div>
                </div>
                <div class="question-number">Final Question</div>
            </div>
            <div class="question" id="bonusQuestionText"></div>
            <div class="options" id="bonusOptionsContainer"></div>
            <button class="next-btn" id="bonusNextBtn" onclick="finishQuiz()" disabled>Finish Quiz</button>
        </div>
    </div>
    <div id="bonusOverlay" class="bonus-overlay">
        <div class="bonus-card">
            <div class="bonus-emoji">🎉</div>
            <div class="bonus-text">Ready for the bonus question?</div>
            <div class="bonus-buttons">
                <button class="btn-bonus" onclick="goToBonus()">YES</button>
                <button class="btn-bonus" onclick="goToBonus()">YESSSSSS</button>
            </div>
        </div>
    </div>
    <script>
        function createRosePetals() {
            for (let i = 0; i < 15; i++) {
                const petal = document.createElement('div');
                petal.className = 'rose-petal';
                petal.innerHTML = '🌹';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.top = Math.random() * 100 + '%';
                petal.style.fontSize = (15 + Math.random() * 25) + 'px';
                petal.style.animationDelay = Math.random() * 6 + 's';
                petal.style.opacity = 0.2 + Math.random() * 0.3;
                document.body.appendChild(petal);
            }
        }
        createRosePetals();
        
        const quizQuestions = [
            { question: "What makes a perfect romantic date?", options: ["Starry night picnic", "Cozy movie night", "Adventure together", "Quiet dinner"], correct: 0 },
            { question: "Which love language is most important?", options: ["Words of affirmation", "Quality time", "Acts of service", "Physical touch"], correct: 1 },
            { question: "What makes you feel most loved?", options: ["Deep conversations", "Surprise gestures", "Just being together", "All of these"], correct: 3 },
            { question: "Favorite romantic movie type?", options: ["Classic romance", "Romantic comedy", "Drama", "Any with you"], correct: 3 },
            { question: "Ideal Sunday together?", options: ["Brunch and walk", "Movie and cuddle", "Try new things", "Your choice"], correct: 2 },
            { question: "Your love style?", options: ["Passionate", "Companionate", "Playful", "All-encompassing"], correct: 3 },
            { question: "Best part of deep connections?", options: ["Being understood", "Shared laughter", "Unspoken bonds", "Everything"], correct: 0 },
            { question: "How do you show affection?", options: ["Through words", "Through actions", "Through time", "All ways"], correct: 3 },
            { question: "What builds strongest bonds?", options: ["Trust", "Communication", "Shared experiences", "All three"], correct: 3 },
            { question: "Love is...", options: ["A journey", "A feeling", "A choice", "Everything with you"], correct: 3 }
        ];
        
        const bonusQuestion = {
            question: "Would you take a chance on something beautiful?",
            options: ["Absolutely yes!", "Without a doubt!", "Let's create our story!"],
            correct: [0, 1, 2]
        };
        
        let currentQuestionIndex = 0;
        let answered = false;
        
        function displayQuestion() {
            const question = quizQuestions[currentQuestionIndex];
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            question.options.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn, false);
                optionsContainer.appendChild(btn);
            });
            updateProgressBar();
            answered = false;
            document.getElementById('nextBtn').disabled = true;
        }
        
        function selectOption(index, element, isBonus) {
            if (answered) return;
            answered = true;
            const question = isBonus ? bonusQuestion : quizQuestions[currentQuestionIndex];
            const container = isBonus ? '#bonusOptionsContainer' : '#optionsContainer';
            document.querySelectorAll(container + ' .option').forEach(opt => {
                opt.style.pointerEvents = 'none';
            });
            element.classList.add('selected');
            const isCorrect = Array.isArray(question.correct) ? question.correct.includes(index) : question.correct === index;
            if (isCorrect) {
                element.classList.add('correct');
                createQuizConfetti(element);
            }
            const btn = isBonus ? document.getElementById('bonusNextBtn') : document.getElementById('nextBtn');
            btn.disabled = false;
        }
        
        function displayBonusQuestion() {
            document.getElementById('bonusQuestionText').textContent = bonusQuestion.question;
            const optionsContainer = document.getElementById('bonusOptionsContainer');
            optionsContainer.innerHTML = '';
            bonusQuestion.options.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn, true);
                optionsContainer.appendChild(btn);
            });
            answered = false;
            document.getElementById('bonusNextBtn').disabled = true;
        }
        
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < 10) {
                displayQuestion();
            } else if (currentQuestionIndex === 10) {
                document.getElementById('bonusOverlay').classList.add('active');
            }
        }
        
        function goToBonus() {
            document.getElementById('bonusOverlay').classList.remove('active');
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('bonusQuestionScreen').classList.add('active');
            displayBonusQuestion();
        }
        
        function finishQuiz() {
            alert('Thank you for playing! Hope this brought a smile!');
        }
        
        function updateProgressBar() {
            const progress = ((currentQuestionIndex + 1) / 10) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        function createQuizConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            const hearts = ['💖', '✨', '💕', '🎊', '🎉'];
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'quiz-confetti';
                    confetti.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    confetti.style.left = x + 'px';
                    confetti.style.top = y + 'px';
                    confetti.style.fontSize = (18 + Math.random() * 15) + 'px';
                    confetti.style.color = ['#b76e79', '#d8a7b1', '#fffaf0', '#ffcccb'][Math.floor(Math.random() * 4)];
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 1500);
                }, i * 50);
            }
        }
        
        displayQuestion();
    </script>
</body>
</html>
